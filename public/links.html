<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InteliCob | Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: linear-gradient(160deg, #a717eb 0%, #7a12b0 45%, #00c2e0 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 56px 20px;
    }

    .page {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      margin-bottom: 18px;
    }

    .avatar svg {
      width: 54px;
      height: 54px;
    }

    .name {
      color: #ffffff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .name span {
      color: #d6faff;
    }

    .tagline {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      text-align: center;
      margin-top: 6px;
      margin-bottom: 28px;
      max-width: 300px;
    }

    .project-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px 20px;
      border-radius: 999px;
      background: #ffffff;
      color: #7a12b0;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.15s ease;
      margin-bottom: 14px;
    }

    .project-btn:hover {
      transform: translateY(-2px);
    }

    .project-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, transform 0.15s ease, color 0.2s ease;
      margin-bottom: 36px;
    }

    .link-btn:hover {
      background: #ffffff;
      color: #7a12b0;
      transform: translateY(-2px);
    }

    .link-btn svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .section-label {
      align-self: flex-start;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-bottom: 14px;
    }

    .team {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .member-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.10);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(6px);
    }

    .member-name {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .member-links {
      display: flex;
      gap: 10px;
    }

    .member-links a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .member-links a:hover {
      background: #ffffff;
      color: #7a12b0;
      transform: translateY(-1px);
    }

    .member-links svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 40px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
